<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Encore</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #070b16; color: #f6f7fb; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100svh; margin: 0; padding: 24px; place-items: center; background: radial-gradient(circle at 50% 0%, #192442 0, #070b16 55%); }
      main { width: min(100%, 560px); padding: 42px 28px; border: 1px solid #394563; border-radius: 16px; background: #10182a; text-align: center; box-shadow: 0 24px 70px rgb(0 0 0 / .3); }
      span { color: #62fae3; font: 800 .8rem ui-monospace, monospace; letter-spacing: .14em; }
      h1 { margin: 14px 0 10px; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1; letter-spacing: -.05em; }
      p { margin: 0 auto 26px; max-width: 38ch; color: #adb8ce; line-height: 1.6; }
      a { display: inline-flex; min-height: 46px; padding: 0 18px; border-radius: 10px; align-items: center; color: #07111d; background: #62fae3; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span>404 · ENCORE</span>
      <h1>This page missed the encore.</h1>
      <p>The link may be old, but your concert archive is still here.</p>
      <a href="/">Back to concerts</a>
    </main>
  </body>
</html>
