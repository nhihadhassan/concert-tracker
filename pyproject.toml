[project]
name = "concert-tracker-api"
version = "0.1.0"
description = "FastAPI domain service for Concert Tracker"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.116",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "sync*"]
exclude = ["data*", "docs*", "frontend*", "supabase*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
